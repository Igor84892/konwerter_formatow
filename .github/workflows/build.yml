name: Build GUI EXE

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pyinstaller
        pip install pyyaml
        pip install xmltodict
        pip install tk

    - name: Build GUI EXE
      run: pyinstaller --onefile --noconsole src/gui_app.py

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: gui_app.exe
        path: dist/gui_app.exe
